[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coolingpath"
version = "0.1.0"
description = "Spatial-data-driven shade-aware walking route visualization"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.40,<2", "streamlit-folium>=0.23,<1",
  "pandas>=2.2,<3", "geopandas>=1,<2", "networkx>=3.4,<4",
  "scipy>=1.14,<2", "shapely>=2,<3", "pyproj>=3.6,<4",
  "folium>=0.18,<1", "branca>=0.8,<1", "altair>=5,<6",
  "requests>=2.32,<3", "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
